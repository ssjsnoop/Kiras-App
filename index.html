<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1230">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kira's App">
<title>Kira's App</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--vh:100dvh;--bg1:#0a1230;--bg2:#17284f;--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.13);--line:rgba(255,255,255,.15);--txt:#eef2ff;--mut:#a9b8de;--teal:#6ee7d8;--lav:#b9a8ff;--warm:#ffd8a0;--rose:#ff9db8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a1230;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
textarea,input[type=text]{-webkit-user-select:text;user-select:text}
#app{position:fixed;left:0;top:0;width:100%;height:var(--vh);display:flex;flex-direction:column;background:radial-gradient(1200px 700px at 15% -10%,#2a428c55,transparent 60%),radial-gradient(900px 600px at 100% 100%,#6a45a840,transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2));padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hdr{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:58px;flex:0 0 auto}
#hdr h1{flex:1;margin:0;font-size:1.15rem;font-weight:650;text-align:center;letter-spacing:.2px}
.ib{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:1.25rem;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ib.hide{visibility:hidden}
#main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:6px 16px 96px;-webkit-overflow-scrolling:touch}
.wrap{max-width:740px;margin:0 auto}
h2{margin:18px 0 8px;font-size:1.2rem}
h3{margin:0 0 6px;font-size:1.05rem}
p{line-height:1.55;margin:8px 0;color:#dfe6ff}
small,.mut{color:var(--mut)}
.hello .big{font-size:1.7rem;font-weight:700;margin-top:4px}
.hello .sub{color:var(--mut);margin:4px 0 14px;line-height:1.45}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--txt);font:inherit;font-weight:600;padding:14px 18px;border-radius:16px;cursor:pointer;min-height:50px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#4fd1c5,#6a8cff);border:none;color:#04122a}
.btn.ghost{background:transparent}
.btn.full{width:100%}
.sos{width:100%;display:block;text-align:left;border:none;border-radius:22px;padding:20px 20px;font:inherit;font-size:1.25rem;font-weight:700;color:#1a0a1f;background:linear-gradient(135deg,#ffb4c8,#ffd8a0);box-shadow:0 8px 30px #ff9db833;cursor:pointer}
.sos small{display:block;font-size:.92rem;font-weight:500;color:#4a2a45;margin-top:4px}
.sos:active{transform:scale(.98)}
.note{margin:12px 0;padding:12px 14px;border-radius:14px;background:rgba(110,231,216,.1);border:1px solid rgba(110,231,216,.3);line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--txt);font:inherit;cursor:pointer;min-height:112px}
.tile:active{transform:scale(.97);background:var(--card2)}
.tile .em{font-size:1.9rem;margin-bottom:4px}
.tile b{font-size:1.02rem}
.tile small{font-size:.8rem;line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin:12px 0}
.card.click{cursor:pointer;display:block;width:100%;text-align:left;color:var(--txt);font:inherit}
.card.click:active{background:var(--card2)}
.tag{display:inline-block;font-size:.72rem;padding:3px 9px;border-radius:99px;background:rgba(185,168,255,.18);color:var(--lav);margin-bottom:6px;font-weight:600}
.helps{color:var(--teal);font-weight:600}
details{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 16px;margin:10px 0}
summary{padding:14px 0;font-weight:650;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";float:right;color:var(--mut)}
details[open] summary::after{content:"－"}
details>div{padding-bottom:12px}
.verse{border-left:3px solid var(--lav);padding:4px 0 4px 12px;margin:12px 0}
.verse b{display:block;color:var(--lav);font-size:.85rem;margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;align-items:center}
.row.center{justify-content:center}
.foot{text-align:center;color:var(--mut);font-size:.85rem;margin:26px 0 6px}
/* breathing */
.orbwrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0}
.orbbox{width:min(70vw,calc(var(--vh)*.38),320px);aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center;margin:6px 0}
.orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c9fff7,#4fd1c5 45%,#2f5fb5 100%);box-shadow:0 0 60px #6ee7d855,inset 0 0 40px #ffffff30;transform:scale(.55);transition-property:transform;transition-timing-function:ease-in-out;transition-duration:1s}
.orbtxt{position:relative;z-index:2;text-align:center;font-weight:650;font-size:1.02rem;padding:0 14%;text-shadow:0 1px 10px #000a;line-height:1.25}
.bcount{font-size:2.1rem;font-weight:700;height:2.6rem;color:var(--teal)}
.bcyc{color:var(--mut);height:1.4rem}
/* guided */
.gbox{display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;padding:10px 0}
.gstep{font-size:1.35rem;line-height:1.5;min-height:9rem;display:flex;align-items:center;justify-content:center;padding:0 6px}
.bar{width:100%;height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fd1c5,#b9a8ff);transition:width .3s linear}
.gtime{color:var(--mut);height:1.2rem}
/* grounding */
.gr{text-align:center;padding:10px 0}
.grem{font-size:3.4rem}
.grn{font-size:1.5rem;font-weight:700;margin:4px 0}
.dots{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.dot{width:62px;height:62px;border-radius:50%;border:2px solid var(--teal);background:transparent;color:var(--teal);font:inherit;font-size:1.3rem;font-weight:700;cursor:pointer}
.dot.on{background:var(--teal);color:#04122a}
/* range */
input[type=range]{width:100%;accent-color:#6ee7d8;height:36px}
.rv{font-size:2.6rem;font-weight:700;text-align:center;color:var(--warm)}
.rl{display:flex;justify-content:space-between;color:var(--mut);font-size:.82rem}
.stepper{color:var(--mut);font-size:.85rem;text-align:center;margin-bottom:4px}
.big{font-size:1.3rem;line-height:1.5}
.say{font-size:1.5rem;line-height:1.45;text-align:center;min-height:9rem;display:flex;align-items:center;justify-content:center;font-weight:600}
/* sounds */
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sbtn{padding:16px 10px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.sbtn span{font-size:1.8rem}
.sbtn.on{background:linear-gradient(135deg,#4fd1c566,#6a8cff66);border-color:var(--teal)}
.chip{padding:10px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;cursor:pointer}
.chip.on{background:var(--teal);color:#04122a;font-weight:700}
#np{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));background:#1b2c5c;border:1px solid var(--teal);color:var(--txt);padding:8px 14px;font-size:.85rem;border-radius:99px;font:inherit;font-size:.85rem;font-weight:600;z-index:20;display:none;box-shadow:0 6px 24px #0008;cursor:pointer}
/* word game */
.wg{display:flex;flex-direction:column;align-items:center;gap:6px}
.wrow{display:flex;gap:6px}
.wc{width:min(15vw,calc(var(--vh)*.075),56px);aspect-ratio:1;border:2px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;text-transform:uppercase}
.wc.f{border-color:#8fa0d0}
.wc.g{background:#3a9d6a;border-color:#3a9d6a}
.wc.y{background:#c9a227;border-color:#c9a227}
.wc.x{background:#3b4468;border-color:#3b4468}
.kb{display:flex;flex-direction:column;gap:6px;width:100%;max-width:520px;margin-top:8px}
.kr{display:flex;gap:5px;justify-content:center}
.k{flex:1;max-width:46px;min-width:0;height:48px;border-radius:9px;border:none;background:#34426f;color:var(--txt);font:inherit;font-weight:700;text-transform:uppercase;cursor:pointer;padding:0}
.k.w{max-width:64px;flex:1.5}
.k.g{background:#3a9d6a}.k.y{background:#c9a227}.k.x{background:#1f2644;color:#7f8bb3}
.msg{min-height:1.5rem;text-align:center;color:var(--warm);font-weight:600}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0;min-height:56px}
.tl{width:48px;height:54px;border-radius:12px;border:2px solid var(--line);background:var(--card2);color:var(--txt);font:inherit;font-size:1.5rem;font-weight:700;text-transform:uppercase;cursor:pointer}
.tl.used{opacity:.25}
.tl.ans{border-color:var(--teal)}
/* adventure */
.alog{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:18px;padding:14px;height:min(42vh,calc(var(--vh)*.4));overflow-y:auto;line-height:1.55}
.alog p{margin:0 0 10px}
.alog .you{color:var(--teal)}
.alog .rn{color:var(--warm);font-weight:700}
.compass{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,54px);gap:6px;justify-content:center;margin:12px 0}
.compass button{border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font:inherit;font-weight:700;font-size:1.1rem;cursor:pointer}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
/* draw & pop */
canvas#cv{width:100%;max-width:min(560px,calc(var(--vh)*.58));aspect-ratio:1;display:block;margin:8px auto;border-radius:20px;background:#070d24;border:1px solid var(--line);touch-action:none}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:#fff}
.bubs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:420px;margin:10px auto}
.bub{aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle at 32% 28%,#ffffffaa,#8fd3ff66 40%,#6a8cff55 100%);box-shadow:inset 0 0 14px #ffffff55,0 4px 10px #0005;transition:transform .12s,opacity .25s}
.bub.p{transform:scale(.35);opacity:.15;box-shadow:none}
/* worry */
textarea{width:100%;min-height:130px;border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--txt);font:inherit;padding:12px;resize:vertical}
.float{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:80vw;background:#fff2;border:1px solid var(--line);padding:14px 18px;border-radius:16px;animation:fl 4.5s ease-in forwards;pointer-events:none;z-index:30}
@keyframes fl{to{transform:translate(-50%,-420%) scale(.4);opacity:0}}
#heart{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:1px solid #ff9db866;background:rgba(255,120,160,.22);font-size:1.6rem;z-index:25;cursor:pointer;display:flex;align-items:center;justify-content:center;animation:hb 2.4s ease-in-out infinite;padding:0;box-shadow:0 4px 18px #ff6f9f44}
#heart:active{transform:scale(.88)}
@keyframes hb{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:linear-gradient(135deg,#ff9db8,#ffd8a0);color:#3a1030;padding:14px 20px;border-radius:18px;font-size:1.1rem;z-index:80;opacity:0;pointer-events:none;transition:all .3s;max-width:88vw;text-align:center;box-shadow:0 8px 30px #0006}
#toast.show{opacity:1;transform:translate(-50%,0)}
.fh{position:fixed;font-size:1.4rem;z-index:26;pointer-events:none;animation:fhup 1.6s ease-out forwards}
@keyframes fhup{to{transform:translate(var(--dx),-180px) scale(1.3);opacity:0}}
.cf{position:fixed;top:-14px;width:10px;height:14px;border-radius:2px;z-index:70;pointer-events:none;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.overlay{position:fixed;inset:0;z-index:90;background:rgba(5,10,30,.88);display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
.obox{text-align:center;max-width:420px;width:100%;position:relative;z-index:2}
.dadface{font-size:6rem;animation:shk .35s infinite}
@keyframes shk{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.oh{font-size:2rem;font-weight:800;color:var(--warm)}
.shout{font-size:2.6rem;font-weight:900;color:#ff6b6b;margin:6px 0;animation:shk .25s infinite}
.hr{position:absolute;top:-40px;color:#8a5a2b;font-size:2rem;font-weight:800;z-index:1;animation:hfall linear forwards}
@keyframes hfall{to{transform:translateY(110vh) rotate(300deg)}}
.dnp{background:#c62828;border-color:#ff8a80;color:#fff}
.scene{position:relative;height:min(46vh,calc(var(--vh)*.44),310px);border-radius:24px;overflow:hidden;background:linear-gradient(#bfe9ff 0%,#eaf9d6 60%,#9bdc8a 60%,#7cc971 100%);border:1px solid var(--line);transition:background .6s}
.scene.night{background:linear-gradient(#1b2150 0%,#2d3470 60%,#26563f 60%,#1d4430 100%)}
.scene .pet{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;cursor:pointer}
.scene .pet svg{height:96%;width:auto;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.scene.night .pet svg{animation-duration:4s}
@keyframes bob{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-4px) scaleY(1.02)}}
.scene .poop{position:absolute;bottom:8%;font-size:1.7rem;pointer-events:none}
.fx{position:absolute;font-size:2rem;pointer-events:none;animation:fxp 1.4s ease-out forwards}
@keyframes fxp{0%{transform:translateY(0) scale(.6);opacity:1}100%{transform:translateY(-90px) scale(1.4);opacity:0}}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:12px 0}
.bar2{display:flex;align-items:center;gap:8px}
.trk{flex:1;height:12px;border-radius:99px;background:var(--card2);overflow:hidden}
.trk i{display:block;height:100%;border-radius:99px;transition:width .4s}
.abts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.abtn{padding:12px 4px;border-radius:16px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.abtn span{font-size:1.6rem}
.abtn:active{transform:scale(.95)}
.petsay{min-height:2.6rem;text-align:center;color:var(--warm);font-weight:600;margin:8px 0}
.eggs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.eggb{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 4px;color:var(--txt);font:inherit;font-weight:600;font-size:.85rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.eggb svg{width:100%;max-width:90px;height:auto}
.eggbig{display:flex;justify-content:center;margin:10px 0}
.eggbig svg{height:min(40vh,calc(var(--vh)*.4),280px);width:auto;cursor:pointer}
.wob{animation:wob .5s}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.hall{display:flex;gap:8px;flex-wrap:wrap}
.hall div{width:76px;text-align:center;font-size:.72rem;color:var(--mut)}
.hall svg{width:100%;height:auto}
input.tx{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--txt);font:inherit;font-size:1.1rem}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:10px auto}
.mc{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:linear-gradient(135deg,#4a5fb0,#7a52d6);font-size:2rem;cursor:pointer;color:#fff;padding:0}
.mc.o{background:var(--card2)}
.mc.d{background:rgba(110,231,216,.25);border-color:var(--teal)}
.ffs{position:relative;height:min(52vh,calc(var(--vh)*.5),420px);border-radius:22px;background:radial-gradient(ellipse at 50% 100%,#1f3b2f,#0a1230 70%);border:1px solid var(--line);overflow:hidden;touch-action:manipulation}
.ff{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(circle,#fff8b0 0%,#ffe45c 35%,#ffe45c00 70%);box-shadow:0 0 18px 6px #ffe45c88;border:none;padding:0;cursor:pointer}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:340px;margin:14px auto}
.pad{aspect-ratio:1;border-radius:24px;border:none;cursor:pointer;opacity:.55;transition:opacity .15s,transform .15s}
.pad.lit{opacity:1;transform:scale(1.06);box-shadow:0 0 30px currentColor}
.purr{font-size:min(40vw,200px);text-align:center;line-height:1.1;cursor:pointer;margin:10px 0;user-select:none}
.purr:active{transform:scale(.93)}
.joke{font-size:1.3rem;line-height:1.5;text-align:center;min-height:7rem;display:flex;align-items:center;justify-content:center}
@media (orientation:landscape) and (max-height:520px){.bsplit{display:flex;gap:16px;align-items:center}.bsplit>*{flex:1 1 50%;min-width:0}.orbbox{width:min(34vw,calc(var(--vh)*.38),160px);margin:0}.bcount{font-size:1.5rem;height:1.8rem}.orbwrap{gap:4px}}
@media (prefers-reduced-motion:reduce){.orb{transition-duration:0s!important}}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <button class="ib hide" id="back" aria-label="Back">←</button>
    <h1 id="title">Kira's App</h1>
    <button class="ib" id="snd" aria-label="Toggle sound effects">🔔</button>
  </div>
  <div id="main"></div>
  <button id="np"></button>
  <button id="heart" aria-label="A message from Dad">❤️</button>
  <div id="toast"></div>
</div>

<script>
(function(){
'use strict';
var $=function(s,e){return (e||document).querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var store={get:function(k,d){try{var v=localStorage.getItem('kira.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem('kira.'+k,JSON.stringify(v))}catch(e){}}};
var main=$('#main'),titleEl=$('#title'),backBtn=$('#back'),sndBtn=$('#snd'),npBtn=$('#np');

/* ---------- viewport fit (rotation-safe) ---------- */
function fit(){
  var h=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  document.documentElement.style.setProperty('--vh',Math.round(h)+'px');
}
function refit(){
  fit();
  [80,250,500,1000].forEach(function(ms){setTimeout(function(){
    fit();
    var a=$('#app'); a.style.transform='translateZ(0)'; void a.offsetHeight; a.style.transform='';
  },ms)});
}
window.addEventListener('resize',refit);
window.addEventListener('orientationchange',refit);
if(window.visualViewport){window.visualViewport.addEventListener('resize',refit);}
document.addEventListener('visibilitychange',function(){if(!document.hidden)refit()});
window.addEventListener('pageshow',refit);
fit();

/* ---------- audio ---------- */
var AC=null,soundOn=store.get('sfx',true);
function ac(){if(!AC){var C=window.AudioContext||window.webkitAudioContext;AC=new C()}if(AC.state==='suspended')AC.resume();return AC}
function updSnd(){sndBtn.textContent=soundOn?'🔔':'🔕'}
sndBtn.onclick=function(){soundOn=!soundOn;store.set('sfx',soundOn);updSnd();if(soundOn)chime(660,.08,1.2)};
updSnd();
function chime(f,v,d){
  if(!soundOn)return;
  try{var a=ac(),t=a.currentTime;f=f||528;v=v||.14;d=d||2.6;
    [1,2.01,3.2].forEach(function(m,i){var o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f*m;

function breathUI(c,tech,o){
  o=o||{};
  c.innerHTML='<div class="orbwrap"><div class="orbbox"><div class="orb"></div><div class="orbtxt">Ready when you are</div></div><div class="bcount"></div><div class="bcyc"></div><button class="btn primary">Start</button></div>';
  var orb=$('.orb',c),otxt=$('.orbtxt',c),bc=$('.bcount',c),bcy=$('.bcyc',c),btn=$('button',c);
  var run=false,timers=[],cyc=0;
  function clr(){timers.forEach(function(i){clearTimeout(i);clearInterval(i)});timers=[]}
  function stop(){run=false;clr();lockOff()}
  onLeave(stop);
  function phase(i){
    if(!run)return;
    var p=tech.phases[i];
    otxt.textContent=p.t;
    orb.style.transitionDuration=p.s+'s';
    if(p.to!=null)orb.style.transform='scale('+p.to+')';
    var left=p.s;bc.textContent=left;
    var iv=setInterval(function(){left--;if(left>0)bc.textContent=left},1000);
    timers.push(iv);
    timers.push(setTimeout(function(){
      clearInterval(iv);
      if(i+1<tech.phases.length){phase(i+1)}
      else{cyc++;bcy.textContent='Round '+Math.min(cyc+1,tech.cycles)+' of '+tech.cycles;
        if(cyc>=tech.cycles){finish()}else{phase(0)}}
    },p.s*1000));
  }
  function finish(){
    run=false;clr();lockOff();
    orb.style.transitionDuration='3s';orb.style.transform='scale(.7)';
    otxt.textContent='Well done 💙';bc.textContent='';bcy.textContent='Notice how your body feels now.';
    btn.textContent='Go again';chime(528);
    if(o.onDone)o.onDone();
  }
  function start(){
    if(run){stop();btn.textContent='Start';otxt.textContent='Paused. Start when ready.';bc.textContent='';return}
    ac();run=true;cyc=0;lockOn();btn.textContent='Pause';bcy.textContent='Round 1 of '+tech.cycles;
    orb.style.transitionDuration='1s';orb.style.transform='scale('+OUT+')';
    timers.push(setTimeout(function(){phase(0)},900));
  }
  btn.onclick=start;
  if(o.auto)start();
}

function guided(c,sess,onEnd){
  var i=-1,left=0,paused=true,iv=null,done=0,total=sess.steps.reduce(function(a,s){return a+s.s},0);
  c.innerHTML='<div class="gbox"><div class="gstep"></div><div class="bar"><i></i></div><div class="gtime"></div><div class="row center"><button class="btn primary" id="gp">Start</button><button class="btn ghost" id="gn">Skip step ▶</button></div></div>';
  var gs=$('.gstep',c),gb=$('.bar i',c),gt=$('.gtime',c),gp=$('#gp',c),gn=$('#gn',c);
  gs.textContent=sess.intro||'Find a comfortable spot. Press Start when you are ready.';
  function upd(){gb.style.width=Math.min(100,done/total*100)+'%';var r=Math.max(0,Math.round(total-done));gt.textContent=(Math.floor(r/60))+':'+('0'+(r%60)).slice(-2)+' left'}
  function nxt(){
    i++;
    if(i>=sess.steps.length){fin();return}
    gs.textContent=sess.steps[i].t;left=sess.steps[i].s;
    if(sess.steps[i].c)chime(440,.08,2);
  }
  function fin(){clearInterval(iv);iv=null;paused=true;lockOff();gs.textContent=sess.end||'Well done.';gb.style.width='100%';gt.textContent='';gp.textContent='Again';i=-1;done=0;left=0;chime(528);if(onEnd)onEnd()}
  gp.onclick=function(){
    if(i===-1&&paused&&gp.textContent!=='Pause'){ac();lockOn();chime(440,.1,2.5);paused=false;gp.textContent='Pause';nxt();upd();
      iv=setInterval(function(){if(paused)return;left-=.25;done+=.25;upd();if(left<=0)nxt()},250);return}
    paused=!paused;gp.textContent=paused?'Resume':'Pause';
  };
  gn.onclick=function(){if(i>=0&&!paused||i>=0){done+=Math.max(0,left);nxt();upd()}};
  onLeave(function(){clearInterval(iv);lockOff()});
}

S.meditate={title:'Meditate',render:function(m){
  m.innerHTML='<p>Meditation is just practicing paying attention, calmly and on purpose. That is all. You cannot be bad at it.</p>'+
  '<div class="note">Everything in here is either simple calm-focus practice (breathing, noticing your body) or Christian meditation on God and His Word. Nothing asks you to empty your mind, chant, or call on anything other than God. If anything ever doesn\'t sit right with your faith, skip it and talk to your parents or pastor.</div>'+
  '<h2>Learn how</h2>'+
  '<details><summary>1. What meditation is (and is not)</summary><div><p>It is <b>not</b> emptying your mind, and it is not sitting perfectly still for an hour. It is practicing steady, kind attention to what is happening right now, or to God and His Word. Your mind will wander. That is normal. Noticing and coming back is the whole workout.</p></div></details>'+
  '<details><summary>2. Meditation in the Bible</summary><div><p>The Bible actually talks about meditating, and it always means <b>filling</b> your mind with God\'s truth, not emptying it.</p><div class="verse">But his delight is in the law of the LORD; and in his law doth he meditate day and night.<b>Psalm 1:2 (KJV)</b></div><div class="verse">When I remember thee upon my bed, and meditate on thee in the night watches.<b>Psalm 63:6 (KJV)</b></div><div class="verse">Let the words of my mouth, and the meditation of my heart, be acceptable in thy sight, O LORD, my strength, and my redeemer.<b>Psalm 19:14 (KJV)</b></div><p>So Christian meditation is quietly thinking about a verse, a truth about God, or His goodness, and talking with Him about it.</p></div></details>'+
  '<details><summary>3. Get comfortable</summary><div><p>Sit in a chair with feet flat, or lie down. Let your hands rest. Close your eyes, or look softly at one spot on the floor. Nothing has to look a certain way. Start with just one minute.</p></div></details>'+
  '<details><summary>4. Pick an anchor</summary><div><p>An anchor is something simple to pay attention to. The easiest is your breath: air at your nostrils, or your belly rising and falling. Or use a short prayer or a single verse, like "Be still, and know that I am God."</p></div></details>'+
  '<details><summary>5. When your mind wanders</summary><div><p>It will, hundreds of times. When you notice you drifted, you did the thing. Quietly say "thinking" and gently return to your anchor. No scolding. Each return is like a bicep curl for your attention.</p></div></details>'+
  '<details><summary>6. When scary feelings show up</summary><div><p>Try <b>R-A-I-N</b>: <b>R</b>ecognize ("this is fear"), <b>A</b>llow it to be there for now, <b>I</b>nvestigate kindly (where do I feel it in my body?), <b>N</b>urture yourself (hand on heart, a kind word, a short prayer). Try "Riding the Wave" below.</p></div></details>'+
  '<details><summary>7. Take your thoughts to God</summary><div><p>When a scary thought loops, you can do what Philippians 4:6 says: turn it into a prayer. "God, I am scared of ___. Please help me." Then breathe out slowly and let it go.</p><div class="verse">Casting all your care upon him; for he careth for you.<b>1 Peter 5:7 (KJV)</b></div></div></details>'+
  '<details><summary>8. Make it a habit</summary><div><p>A little every day beats a lot once. Try the same time daily, like before bed. Practice while you are okay, so the skill is ready when you are not.</p></div></details>'+
  '<h2>Calm and focus</h2>'+
  ['one','anchor','body','wave','safe'].map(function(k){var s=SESS[k];return '<button class="card click" data-go="session" data-arg="'+k+'"><h3>'+s.title+'</h3></button>'}).join('')+
  '<h2>Meditating with God</h2>'+
  ['stillgod','kind','verse','lectio','ps23','thanks'].map(function(k){var s=SESS[k];return '<button class="card click" data-go="session" data-arg="'+k+'"><h3>'+s.title+'</h3></button>'}).join('');
}};

 ['When I\'m scared right now','Jesus, I\'m scared and my body feels out of control. You are right here with me. Hold me steady. Slow my heart, slow my breathing, quiet my thoughts. I don\'t have to figure everything out tonight. I only have to take the next breath, and You are in this breath with me. Amen.'],
 ['When I\'m afraid of dying','God, You made me and You hold my life in Your hands. My mind keeps shouting that something terrible is about to happen. Help me tell the difference between a loud alarm and real danger. Remind me that nothing can separate me from Your love, not even my biggest fears. Give me courage to live today without fear running the show. Amen.'],

var SND=null,sleepT=null,sndVol=.6;

var nbuf={};
function noiseBuf(type){
  if(nbuf[type])return nbuf[type];
  var a=ac(),len=a.sampleRate*4,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0),last=0;
  for(var i=0;i<len;i++){var w=Math.random()*2-1;if(type==='brown'){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w}
  nbuf[type]=b;return b;
}
function mkNoise(type){var a=ac(),s=a.createBufferSource();s.buffer=noiseBuf(type);s.loop=true;s.start();return s}
function startSound(id){
  var a=ac();stopSound(true);
  var master=a.createGain();master.gain.value=0;master.connect(a.destination);
  var srcs=[];
  function lfo(freq,amt,target){var o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;g.gain.value=amt;o.connect(g);g.connect(target);o.start();srcs.push(o)}
  if(id==='rain'){
    var n=mkNoise('white'),hp=a.createBiquadFilter(),lp=a.createBiquadFilter(),g=a.createGain();hp.type='highpass';hp.frequency.value=900;lp.type='lowpass';lp.frequency.value=7500;g.gain.value=.3;
    n.connect(hp);hp.connect(lp);lp.connect(g);g.connect(master);srcs.push(n);
    var n2=mkNoise('brown'),g2=a.createGain();g2.gain.value=.35;n2.connect(g2);g2.connect(master);srcs.push(n2);
  }else if(id==='ocean'){
    var n3=mkNoise('brown'),lp3=a.createBiquadFilter(),g3=a.createGain();lp3.type='lowpass';lp3.frequency.value=900;g3.gain.value=.5;
    n3.connect(lp3);lp3.connect(g3);g3.connect(master);srcs.push(n3);lfo(.09,.4,g3.gain);
    var n4=mkNoise('white'),hp4=a.createBiquadFilter(),g4=a.createGain();hp4.type='highpass';hp4.frequency.value=2500;g4.gain.value=.05;
    n4.connect(hp4);hp4.connect(g4);g4.connect(master);srcs.push(n4);lfo(.09,.04,g4.gain);
  }else if(id==='wind'){
    var n5=mkNoise('white'),bp=a.createBiquadFilter(),g5=a.createGain();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=.8;g5.gain.value=.5;
    n5.connect(bp);bp.connect(g5);g5.connect(master);srcs.push(n5);lfo(.07,250,bp.frequency);lfo(.05,.25,g5.gain);
  }else if(id==='brown'){
    var n6=mkNoise('brown'),g6=a.createGain();g6.gain.value=.9;n6.connect(g6);g6.connect(master);srcs.push(n6);
  }else{
    [130.8,196,329.6].forEach(function(f,k){var o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f+(k-1)*.4;g.gain.value=.22/(k+1);o.connect(g);g.connect(master);o.start();srcs.push(o);lfo(.05+k*.02,.06,g.gain)});
  }
  master.gain.linearRampToValueAtTime(sndVol,a.currentTime+1.5);
  SND={id:id,master:master,srcs:srcs};updNP();
}
function stopSound(quiet){
  if(!SND)return;var s=SND;SND=null;
  try{var a=ac();s.master.gain.cancelScheduledValues(a.currentTime);s.master.gain.setValueAtTime(s.master.gain.value,a.currentTime);s.master.gain.linearRampToValueAtTime(0,a.currentTime+.6);
    setTimeout(function(){s.srcs.forEach(function(x){try{x.stop()}catch(e){}});try{s.master.disconnect()}catch(e){}},750)}catch(e){}
  clearTimeout(sleepT);if(!quiet)updNP();
}
function updNP(){

/* Mystery Word */
var WORDS5='peace brave heart light dream cloud sleep quiet smile happy sunny ocean river stone water grace faith trust truth still bloom field flame fresh honey lemon night pearl plant pride robin shine solar spark storm sweet tiger tulip voice waves wheat world youth angel beach birch bread candy chair clear daisy eagle earth float frost gleam green guide haven house ivory jolly laugh lucky magic melon music north olive panda piano quest relax ridge scent sheep sloth snail spoon sugar swing teach thank toast trail whale windy cozy-x moose lilac grape peach apple mango berry cream dance ember fable giant glide grove happy jelly koala lunar maple noble plain rainy shade shore sleepy-x tidal unity vivid wooly zebra'.split(' ').filter(function(w){return /^[a-z]{5}$/.test(w)});
S.wordgame={title:'Mystery Word',render:function(m){
  var target,rows,curr,over,msg,keys;
  function newGame(){target=WORDS5[Math.floor(Math.random()*WORDS5.length)];rows=[];curr='';over=false;msg='';keys={}}
  function score(g){
    var r=[],t=target.split(''),i;
    for(i=0;i<5;i++)r[i]='x';
    for(i=0;i<5;i++)if(g[i]===t[i]){r[i]='g';t[i]=null}
    for(i=0;i<5;i++)if(r[i]==='x'){var k=t.indexOf(g[i]);if(k>-1){r[i]='y';t[k]=null}}
    return r;
  }
  function draw(){
    var h='<div class="wg">';
    for(var r=0;r<6;r++){
      h+='<div class="wrow">';
      for(var c=0;c<5;c++){
        var ch='',cl='wc';
        if(r<rows.length){ch=rows[r].g[c];cl+=' '+rows[r].s[c]}
        else if(r===rows.length&&!over){ch=curr[c]||'';if(ch)cl+=' f'}
        h+='<div class="'+cl+'">'+ch+'</div>';
      }
      h+='</div>';
    }
    h+='<div class="msg">'+msg+'</div><div class="kb">';
    ['qwertyuiop','asdfghjkl','+zxcvbnm-'].forEach(function(row){
      h+='<div class="kr">';
      row.split('').forEach(function(k){
        if(k==='+')h+='<button class="k w" data-k="enter">Enter</button>';
        else if(k==='-')h+='<button class="k w" data-k="back">⌫</button>';
        else h+='<button class="k '+(keys[k]||'')+'" data-k="'+k+'">'+k+'</button>';
      });
      h+='</div>';
    });
    h+='</div><div class="row center"><button class="btn" id="hint">💡 Hint</button><button class="btn" id="newg">New word</button></div></div>';
    m.innerHTML=h;
    m.querySelectorAll('.k').forEach(function(b){b.onclick=function(){press(b.dataset.k)}});
    $('#hint',m).onclick=function(){
      if(over)return;
      var g=rows.map(function(r){return r.g}).join('');
      var cand=target.split('').filter(function(l){return g.indexOf(l)<0});
      msg=cand.length?('The word has the letter "'+cand[0].toUpperCase()+'".'):'You have found all the letters. Try rearranging!';draw();
    };
    $('#newg',m).onclick=function(){newGame();draw()};
  }
  function press(k){
    if(over)return;blip(440);
    if(k==='back'){curr=curr.slice(0,-1)}
    else if(k==='enter'){
      if(curr.length<5){msg='Needs 5 letters';draw();return}
      var s=score(curr);rows.push({g:curr,s:s});
      for(var i=0;i<5;i++){var l=curr[i],p=keys[l],n=s[i];if(p==='g')continue;if(p==='y'&&n!=='g')continue;keys[l]=n}
      if(curr===target){over=true;msg='🎉 You got it! The word was '+target.toUpperCase();chime(528)}
      else if(rows.length>=6){over=true;msg='The word was '+target.toUpperCase()+'. No worries! Try a new one.'}
      else msg='';
      curr='';
    }else if(curr.length<5){curr+=k;msg=''}
    draw();
  }
  function kd(e){
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key==='Enter')press('enter');else if(e.key==='Backspace')press('back');else if(/^[a-zA-Z]$/.test(e.key))press(e.key.toLowerCase());
  }
  document.addEventListener('keydown',kd);onLeave(function(){document.removeEventListener('keydown',kd)});
  newGame();draw();
}};

/* Word Scramble */
var SCR=[['peaceful','a feeling of calm'],['breathe','you are doing this right now'],['sunrise','the start of a new day'],['forest','a place with many trees'],['comfort','what a warm blanket gives'],['harmony','things fitting together nicely'],['blanket','cozy thing on your bed'],['lantern','a light you carry'],['courage','being brave even when scared'],['rainbow','appears after rain'],['whisper','a very quiet voice'],['steady','not shaky'],['gentle','soft and kind'],['meadow','a grassy field'],['serene','calm and peaceful'],['cuddle','a snuggly hug'],['stillness','quiet with no movement'],['lullaby','a song to help you sleep'],['starlight','light from far away'],['tranquil','very calm']];
S.scramble={title:'Word Scramble',render:function(m){
  var item,tiles,ans,msg,idx=-1;
  function shuffle(w){var a=w.split(''),t=0;do{for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}t++}while(a.join('')===w&&t<20);return a}
  function next(){idx=(idx+1+Math.floor(Math.random()*5))%SCR.length;item=SCR[idx];tiles=shuffle(item[0]).map(function(c){return {c:c,u:false}});ans=[];msg=''}
  function draw(){
    m.innerHTML='<p style="text-align:center">Clue: <b>'+item[1]+'</b> ('+item[0].length+' letters)</p>'+
    '<div class="tiles">'+(ans.length?ans.map(function(t,i){return '<button class="tl ans" data-a="'+i+'">'+t.c+'</button>'}).join(''):'<span class="mut">Tap letters below</span>')+'</div>'+
    '<div class="msg">'+msg+'</div>'+
    '<div class="tiles">'+tiles.map(function(t,i){return '<button class="tl'+(t.u?' used':'')+'" data-t="'+i+'">'+t.c+'</button>'}).join('')+'</div>'+
    '<div class="row center"><button class="btn" id="hint">💡 Hint</button><button class="btn" id="clr">Clear</button><button class="btn" id="skp">Skip ▶</button></div>';
    m.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){
      var i=+b.dataset.t;if(tiles[i].u)return;tiles[i].u=true;ans.push({c:tiles[i].c,i:i});blip(500);
      if(ans.length===item[0].length){
        if(ans.map(function(t){return t.c}).join('')===item[0]){msg='🎉 Yes! '+item[0].toUpperCase();chime(528);draw();setTimeout(function(){if(cur&&cur.name==='scramble'){next();draw()}},1800);return}
        else msg='Not quite. Tap a letter to take it back.';
      }
      draw();
    }});
    m.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){var i=+b.dataset.a;tiles[ans[i].i].u=false;ans.splice(i,1);msg='';draw()}});
    $('#clr',m).onclick=function(){tiles.forEach(function(t){t.u=false});ans=[];msg='';draw()};
    $('#skp',m).onclick=function(){next();draw()};
    $('#hint',m).onclick=function(){msg='It starts with "'+item[0][0].toUpperCase()+'" and ends with "'+item[0].slice(-1).toUpperCase()+'".';draw()};
  }
  next();draw();
}};

var AI={coin:'a silver coin',glow:'a warm glowing stone',daisy:'a white daisy',key:'a rusty key',box:'a little music box'};
S.forest={title:'The Quiet Forest',render:function(m){
  var st,logEl;
  function init(){st={at:'clearing',inv:[],items:{brook:['coin'],cave:['glow'],meadow:['daisy'],cabin:['box']},frog:false,open:false,won:false,prev:'clearing'}}
  function say(t,cls){var p=document.createElement('p');if(cls)p.className=cls;p.innerHTML=t;logEl.appendChild(p);logEl.scrollTop=logEl.scrollHeight}
  function look(){
    var r=AR[st.at];say('<span class="rn">'+r.n+'</span><br>'+r.d);
    if(st.at==='pond')say(st.frog?'The frog is happily admiring your coin.':'The frog stares at you. "Ribbit." It seems to be looking for something shiny.');
    if(st.at==='oak')say(st.won?'The owl is gently humming along to the music.':'The owl sighs. "Hoo... I lost my music box, and I cannot sleep without its lullaby. I think I left it in the little cabin..."');
    if(st.at==='mush'&&!st.open)say('The cabin door is shut tight.');
    var it=st.items[st.at]||[];if(it.length&&!(st.at==='cabin'&&!st.open))say('You see: '+it.map(function(i){return AI[i]}).join(', ')+'.');
  }
  function mv(d){
    var r=AR[st.at],t=r.x[d];
    if(st.at==='outside'){return}
    say('Go '+({n:'north',s:'south',e:'east',w:'west'}[d])+'.','you');
    if(!t){say(st.at==='cave'?'Solid rock. You cannot go that way.':'The trees are too thick to pass that way.');return}
    if(t==='OUT'){st.prev=st.at;st.at='outside';say('You walk and walk, and the trees thin out... <b>You have left the forest!</b> The road is quiet and the sky is turning pink. But your forest adventure is not finished yet. Want to go back in?');ui();return}
    if(t==='cabin'&&!st.open){say('You wander up to the little cabin. The door is locked. You will need a key.');return}
    st.at=t;look();ui();
  }
  function act(a,i){
    if(a==='look'){look();return}
    if(a==='inv'){say(st.inv.length?'You are carrying: '+st.inv.map(function(i){return AI[i]}).join(', ')+'.':'You are not carrying anything.');return}
    if(a==='hint'){
      var h;
      if(st.won)h='You did it! Feel free to wander around and enjoy the forest.';
      else if(st.inv.indexOf('box')>-1)h='Bring the music box to the old oak, to the west of the clearing.';
      else if(st.open)h='The cabin is open. Go in through the mushroom ring, north, and take the music box.';
      else if(st.inv.indexOf('key')>-1)h='Use the key at the mushroom ring, where you can see the cabin.';
      else if(st.frog)h='The frog dropped a key! Pick it up at the pond.';
      else if(st.inv.indexOf('coin')>-1)h='The frog at the pond west of the brook likes shiny things.';
      else h='Talk to the owl at the old oak first, then look for something shiny near the water.';
      say('💡 '+h);return}
    if(a==='take'){var it=st.items[st.at];it.splice(it.indexOf(i),1);st.inv.push(i);blip(600);say('You pick up '+AI[i]+'.');ui();return}
    if(a==='use'){
      if(i==='coin'&&st.at==='pond'&&!st.frog){st.frog=true;st.inv.splice(st.inv.indexOf('coin'),1);st.inv.push('key');say('You toss the coin onto the lily pad. The frog\'s eyes go wide. "RIBBIT!" It snatches the coin, hops once, and plops a <b>rusty key</b> into your hand. It was hiding it under the lily pad all along!');chime(660,.08,1.5);ui();return}
      if(i==='key'&&st.at==='mush'&&!st.open){st.open=true;st.inv.splice(st.inv.indexOf('key'),1);say('You walk to the cabin and turn the key. <b>Click.</b> The door swings open. You can go north now.');chime(660,.08,1.5);ui();return}
      if(i==='box'&&st.at==='oak'&&!st.won){st.won=true;st.inv.splice(st.inv.indexOf('box'),1);say('You wind the little key on the music box and set it on a branch. A slow, soft lullaby begins to play. The owl closes his eyes and smiles. One by one, fireflies rise from the grass and the whole forest seems to breathe out. You feel calm, steady and safe.<br><br>✨ <b>THE END</b> ✨<br><br>(You can keep wandering, or play again.)');chime(528);ui();return}
      if(i==='glow'){say('You hold the stone in both hands. It is warm, like a tiny sun. Your shoulders drop and you feel a little steadier.');return}
      if(i==='daisy'){say('You hold the daisy close and breathe in slowly... then breathe out, even slower. That feels nice.');return}
      say('Nothing happens here. Maybe try somewhere else.');
    }
  }
  function ui(){
    var c=$('#ctl',m);if(!c)return;
    var at=st.at;
    if(at==='outside'){c.innerHTML='<div class="acts"><button class="btn primary" id="reenter">🌲 Go back into the forest</button></div>';$('#reenter',m).onclick=function(){st.at=st.prev;say('You step back among the trees.','you');look();ui()};return}
    var h='<div class="compass"><span></span><button data-d="n">N</button><span></span><button data-d="w">W</button><span></span><button data-d="e">E</button><span></span><button data-d="s">S</button><span></span></div><div class="acts">';
    h+='<button class="btn" data-a="look">👁 Look</button><button class="btn" data-a="inv">🎒 Bag</button><button class="btn" data-a="hint">💡 Hint</button>';
    var it=(st.items[at]||[]);if(!(at==='cabin'&&!st.open))it.forEach(function(i){h+='<button class="btn primary" data-a="take" data-i="'+i+'">Take '+AI[i].replace(/^an? /,'')+'</button>'});
    st.inv.forEach(function(i){h+='<button class="btn" data-a="use" data-i="'+i+'">Use '+AI[i].replace(/^an? /,'')+'</button>'});
    h+='<button class="btn ghost" data-a="restart">↺ Restart</button></div>';
    c.innerHTML=h;
    c.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){mv(b.dataset.d)}});
    c.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){
      if(b.dataset.a==='restart'){init();logEl.innerHTML='';say('You wake up in a quiet forest. An owl\'s voice drifts across the trees...');look();ui();return}
      act(b.dataset.a,b.dataset.i)}});
  }
  m.innerHTML='<div class="alog" id="alog"></div><div id="ctl"></div>';
  logEl=$('#alog',m);init();
  say('You wake up in a quiet forest. Nothing is chasing you. Nothing is wrong. Use the N, S, E and W buttons to explore, and see what you can find.');
  look();ui();
}};

S.bubbles={title:'Bubble pop',render:function(m){
  var N=40;
  function fill(){
    var h='<div class="bubs">';for(var i=0;i<N;i++)h+='<button class="bub" aria-label="bubble"></button>';
    h+='</div><div class="row center"><button class="btn" id="fill">Refill bubbles</button></div><p class="mut" style="text-align:center">Breathe out slowly with every pop.</p>';

S.draw={title:'Mandala drawing',render:function(m){
  var COL=['#6ee7d8','#b9a8ff','#ffd8a0','#ff9db8','#8fb6ff','#ffffff'],col=COL[0],sym=8,mir=true;
  var SZ=1000,drawing=false,lx=0,ly=0;
  m.innerHTML='<canvas id="cv" width="'+SZ+'" height="'+SZ+'"></canvas><div class="row center" id="cols"></div><div class="row center"><button class="chip" data-s="6">6-fold</button><button class="chip on" data-s="8">8-fold</button><button class="chip" data-s="12">12-fold</button><button class="chip on" id="mirb">Mirror on</button></div><div class="row center"><button class="btn" id="clr">Clear</button></div>';
  var cv=$('#cv',m),ctx=cv.getContext('2d');
  function bg(){ctx.clearRect(0,0,SZ,SZ);ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=2;[120,260,400,480].forEach(function(r){ctx.beginPath();ctx.arc(SZ/2,SZ/2,r,0,Math.PI*2);ctx.stroke()})}
  bg();
  var cols=$('#cols',m);
  COL.forEach(function(c,i){var b=document.createElement('button');b.className='sw'+(i===0?' on':'');b.style.background=c;b.onclick=function(){col=c;cols.querySelectorAll('.sw').forEach(function(x){x.classList.remove('on')});b.classList.add('on')};cols.appendChild(b)});
  m.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){sym=+b.dataset.s;m.querySelectorAll('[data-s]').forEach(function(x){x.classList.remove('on')});b.classList.add('on')}});
  $('#mirb',m).onclick=function(e){mir=!mir;e.target.classList.toggle('on',mir);e.target.textContent=mir?'Mirror on':'Mirror off'};
  $('#clr',m).onclick=bg;
  function pos(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*SZ,(e.clientY-r.top)/r.height*SZ]}
  function seg(x0,y0,x1,y1){
    var c=SZ/2;ctx.strokeStyle=col;ctx.lineWidth=5;ctx.lineCap='round';ctx.shadowColor=col;ctx.shadowBlur=10;
    for(var k=0;k<sym;k++){
      var a=k*2*Math.PI/sym,ca=Math.cos(a),sa=Math.sin(a);
      for(var f=0;f<(mir?2:1);f++){
        var s=f?-1:1;
        var ax=(x0-c)*s,ay=y0-c,bx=(x1-c)*s,by=y1-c;
        ctx.beginPath();
        ctx.moveTo(c+ax*ca-ay*sa,c+ax*sa+ay*ca);
        ctx.lineTo(c+bx*ca-by*sa,c+bx*sa+by*ca);
        ctx.stroke();
      }
    }
    ctx.shadowBlur=0;
  }
  cv.addEventListener('pointerdown',function(e){drawing=true;var p=pos(e);lx=p[0];ly=p[1];try{cv.setPointerCapture(e.pointerId)}catch(x){}seg(lx,ly,lx+.1,ly+.1);e.preventDefault()});

/* ---------- UNDERSTAND ---------- */
S.understand={title:'Understand panic',render:function(m){
  m.innerHTML='<p>Knowing what is going on in your body takes away a lot of its power.</p>'+
  '<details open><summary>😨 "What if I suddenly die?"</summary><div><p>This is one of the most common fears people have with anxiety, and having the thought does <b>not</b> mean it is going to happen. The anxious brain is a bad fortune-teller: it takes "what if" and makes it feel like "will".</p><p>You do not have to solve the big question tonight. When the thought shows up, try: <b>1)</b> Label it: "There is the what-if thought." <b>2)</b> Breathe out slowly. <b>3)</b> Put it in the Worry Jar or hand it over in a prayer. <b>4)</b> Do something else for a few minutes.</p><p>It is also worth telling a parent. Fear that has been around for years can really be helped, and you do not have to carry it alone.</p></div></details>'+
  '<details><summary>🚨 What is a panic attack?</summary><div><p>It is your body\'s alarm system going off when there is no real danger. Your brain releases adrenaline, the same "fight or flight" chemical you would get if a bear walked in. Your heart pounds, your breathing speeds up, and you might feel dizzy, shaky, tingly, sweaty or like things are not real.</p></div></details>'+
  '<details><summary>🫀 Why does it feel like dying?</summary><div><p>Every symptom is adrenaline doing its job: pounding heart, tight chest, fast breathing, dizziness. These feelings are intense and truly uncomfortable, but they are not harmful in themselves. They are the body getting ready to run, with nothing to run from.</p></div></details>'+
  '<details><summary>🌊 How long does it last?</summary><div><p>Panic usually peaks within about 10 minutes and then fades, even though it can feel much longer. Adrenaline cannot keep rising forever. Every wave you have had so far has ended.</p></div></details>'+
  '<details><summary>🔁 Why does it keep coming back?</summary><div><p>The "fear of the fear" loop: you feel a body sensation, get scared, the fear makes more adrenaline, and that makes the sensation stronger. Fighting the feeling feeds it. Floating through it, slowly breathing and letting it pass, is what teaches your brain that it is safe. That is why practicing the breathing and grounding tools matters.</p></div></details>'+
  '<details><summary>💪 What actually helps long-term?</summary><div><p>Practicing calming skills while you are okay. Sleep, movement and not too much caffeine or energy drinks. Talking to someone. And counseling: a type of therapy called <b>CBT</b> is very effective for panic and for fears like this, and most people improve a lot.</p><p>It is also reasonable to have a doctor check you over once. It can rule out physical causes and gives many people real relief.</p></div></details>'+
  '<h2>Things to tell yourself</h2><div class="card">'+SAYS.map(function(s){return '<p>💙 '+esc(s)+'</p>'}).join('')+'</div>';
}};

/* ---------- TALK TO SOMEONE ---------- */
S.talk={title:'Talk to someone',render:function(m){
  m.innerHTML='<div class="card big">You are not a burden. The people who love you want to know when you are scared. Telling someone is one of the strongest things you can do.</div>'+
  '<h2>Who can I tell?</h2><div class="card"><p>👨‍👩‍👧 Mom or Dad. Even just: <b>"I am having a panic wave."</b></p><p>👩‍🏫 A school counselor or a teacher you trust</p><p>⛪ A pastor, youth leader or someone at church</p><p>👭 A friend you trust</p></div>'+
  '<h2>Words you can use</h2><div class="card"><p>"I get really scared that I am going to suddenly die, and I have felt like this for a long time."</p><p>"I would like to talk to someone about my anxiety."</p></div>'+
  '<h2>If you ever need help right away</h2>'+
  '<div class="card"><p>📞 <b>Call or text 988</b> (US Suicide &amp; Crisis Lifeline). It is free, 24/7, and for any emotional crisis, not just emergencies.</p><p>💬 <b>Text HOME to 741741</b> (Crisis Text Line) to text with a trained counselor.</p><p>🚑 <b>Call 911</b> or tell a parent right away if you have chest pain that does not ease up, you cannot breathe, you faint, or you are not sure whether it is panic or something else. It is always okay to check.</p><p>If you ever have thoughts of hurting yourself, tell a grown-up and call or text 988 right then.</p></div>';
}};

S.pet={title:'Pet buddy',render:function(m){
  var pet=store.get('pet',null),tm=null,sayT=null,lastMood='',tick=null,rapid=[],confirmNew=false;
  function save(){if(pet)store.set('pet',pet)}
  function show(){runCleanups();onLeave(function(){save();clearInterval(tick)});
    if(!pet)viewType();else if(pet.stage===0)viewEgg();else viewPlay()}
  function viewType(){
    m.innerHTML='<p style="text-align:center">Every great friend starts as an egg. What kind of egg do you want to hatch?</p>'+
    '<button class="card click" data-t="animal"><h3>🐰 A cutesy animal</h3><div class="helps">Soft, sweet and snuggly. A bunny, a kitten or a bear cub is waiting inside.</div></button>'+
    '<button class="card click" data-t="dragon"><h3>🐉 A fearsome dragon</h3><div class="helps">It will be adorable at first... but wait until it is fully grown. 😈🔥</div></button>'+
    '<p class="mut" style="text-align:center">Your buddy never dies, ever. If you are away, it just gets sleepy and misses you.</p>'+petHall();
    m.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){viewEggs(b.dataset.t)}});
  }
  function viewEggs(type){
    m.innerHTML='<p style="text-align:center">'+(type==='animal'?'Pick an egg. Something cute is inside!':'Pick an egg. Something tiny and (for now) very cute is inside...')+'</p><div class="eggs">'+EGGS[type].map(function(e){return '<button class="eggb" data-e="'+e.id+'">'+eggSVG(e,0)+e.n+'</button>'}).join('')+'</div><div class="row center"><button class="btn ghost" id="bk">← Pick another type</button></div>';
    m.querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){viewName(b.dataset.e)}});
    $('#bk',m).onclick=viewType;
  }
  function viewName(sp){
    var e=eggDef(sp);
    m.innerHTML='<div class="eggbig">'+eggSVG(e,0)+'</div><h3 style="text-align:center">What will you name it?</h3><input class="tx" id="nm" type="text" maxlength="12" placeholder="Name"><div class="row center"><button class="btn primary" id="go">Continue ▶</button></div>';
    $('#go',m).onclick=function(){
      var n=$('#nm',m).value.trim()||'Buddy';
      pet={sp:sp,name:n,stage:0,taps:0,growth:0,hunger:80,happy:80,energy:80,clean:95,poops:0,sleeping:false,last:Date.now()};
      save();show();
    };
  }
  function viewEgg(){
    var e=eggDef(pet.sp);
    m.innerHTML='<h3 style="text-align:center">'+esc(pet.name)+'\'s egg</h3><p style="text-align:center" id="eh">Tap the egg to help it hatch! ('+pet.taps+'/5)</p><div class="eggbig" id="eg">'+eggSVG(e,pet.taps)+'</div>';
    $('#eg',m).onclick=function(){
      pet.taps++;blip(300+pet.taps*60);
      var el=$('#eg',m);el.classList.remove('wob');void el.offsetWidth;
      if(pet.taps>=5){pet.stage=1;pet.growth=0;pet.last=Date.now();save();confetti(70);chime(528);viewPlay();say('✨ '+pet.name+' hatched! Say hello!');return}
      el.innerHTML=eggSVG(e,pet.taps);el.classList.add('wob');$('#eh',m).textContent='Tap the egg to help it hatch! ('+pet.taps+'/5)';save();
    };
  }
  function addGrowth(g){
    pet.growth+=g;var ns=stageFor(pet.growth);
    if(ns>pet.stage){pet.stage=ns;confetti(70);chime(660,.12,2.5);
      var dr=PETS[pet.sp].k==='dragon';
      say(ns===4?(dr?'🔥 '+pet.name+' is fully grown... a FEARSOME dragon! (Still a softie inside.)':'🌟 '+pet.name+' is all grown up!'):'🌱 '+pet.name+' grew into a '+STAGE_NAME[ns].toLowerCase()+'!');
      drawScene();}
  }
  function applyTime(){
    var now=Date.now(),dt=Math.min(600,Math.max(0,(now-pet.last)/60000));pet.last=now;
    if(pet.stage===0||dt<=0)return;var FL=15;
    if(pet.sleeping){pet.energy=Math.min(100,pet.energy+dt*5);pet.hunger=Math.max(FL,pet.hunger-dt*.3)}
    else{pet.energy=Math.max(FL,pet.energy-dt*.35);pet.hunger=Math.max(FL,pet.hunger-dt*.9);pet.happy=Math.max(FL,pet.happy-dt*.5);pet.clean=Math.max(FL,pet.clean-dt*.35);
      pet._pt=(pet._pt||0)+dt;while(pet._pt>25){pet._pt-=25;pet.poops=Math.min(3,(pet.poops||0)+1)}
      addGrowth(Math.min(dt,12)/6)}
  }
  function moodNow(){
    if(tm&&Date.now()<tm.until)return tm.mood;
    if(pet.sleeping)return 'sleep';
    if(pet.hunger<30||pet.happy<30||pet.energy<20)return 'sad';
    return pet.happy>70?'happy':'normal';
  }
  function setMood(mood,ms){tm={mood:mood,until:Date.now()+ms};drawScene();setTimeout(function(){if(cur&&cur.name==='pet')drawScene()},ms+50)}
  function say(t){var el=$('#psay',m);if(el)el.textContent=t}
  function fx(emoji){var sc=$('#scene',m);if(!sc)return;var d=document.createElement('span');d.className='fx';d.textContent=emoji;d.style.left=(30+Math.random()*40)+'%';d.style.top='35%';sc.appendChild(d);setTimeout(function(){d.remove()},1500)}
  function drawScene(){
    var sc=$('#scene',m);if(!sc)return;var mood=moodNow();lastMood=mood;
    sc.classList.toggle('night',!!pet.sleeping);
    var poops='';for(var i=0;i<(pet.poops||0);i++)poops+='<span class="poop" style="left:'+(14+i*14)+'%">💩</span>';
    sc.innerHTML='<div class="pet" id="pt">'+creature(pet.sp,pet.stage,mood)+'</div>'+poops;
    $('#pt',m).onclick=petIt;
  }
  function drawBars(){
    var B=[['🍎',pet.hunger,'#ff8a6b'],['💖',pet.happy,'#ff7aa8'],['⚡',pet.energy,'#ffd86b'],['🫧',pet.clean,'#6ec6ff']];
    var el=$('#bars',m);if(!el)return;
    el.innerHTML=B.map(function(b){return '<div class="bar2"><span>'+b[0]+'</span><div class="trk"><i style="width:'+Math.round(b[1])+'%;background:'+b[2]+'"></i></div></div>'}).join('');
    var st=pet.stage,pg=st>=4?100:(pet.growth-STAGE_AT[st-1])/(STAGE_AT[st]-STAGE_AT[st-1])*100;
    $('#grow',m).style.width=Math.max(0,Math.min(100,pg))+'%';
    $('#gl',m).textContent=STAGE_NAME[st]+(st>=4?' ✨':' · growing up '+Math.round(Math.max(0,Math.min(100,pg)))+'%');
    $('#sl',m).innerHTML=pet.sleeping?'<span>☀️</span>Wake up':'<span>🌙</span>Sleep';
  }
  function petIt(){
    if(pet.sleeping){say('Shhh... '+pet.name+' is sleeping. 💤');return}
    var now=Date.now();rapid.push(now);rapid=rapid.filter(function(t){return now-t<3000});
    pet.happy=Math.min(100,pet.happy+3);blip(600+Math.random()*200);fx('💕');setMood('joy',1200);
    if(rapid.length>=10){say('Hehehe, stop, that tickles!! 🤭');rapid=[]}
    else say(pet.name+' loves it! 💕');
    if(/dad/i.test(pet.name)&&rapid.length===3)say('You named it Dad? It has so much hair though... 😏');
    drawBars();
  }
  function act(kind){
    if(kind==='sleep'){
      if(pet.sleeping){pet.sleeping=false;if(Date.now()-(pet.sleepStart||0)>15000){addGrowth(1);say('☀️ Good morning! '+pet.name+' feels refreshed.')}else say('Barely slept! '+pet.name+' yawns.')}
      else{pet.sleeping=true;pet.sleepStart=Date.now();say('Lights out. Sweet dreams. 🌙')}
      save();drawScene();drawBars();return}
    if(pet.sleeping){say('Shhh... '+pet.name+' is sleeping. Tap Wake up first. 💤');return}
    if(kind==='feed'){
      if(pet.hunger>=95){say(pet.name+' is full! 😋');return}
      pet.hunger=Math.min(100,pet.hunger+30);pet.happy=Math.min(100,pet.happy+3);addGrowth(2);fx(PETS[pet.sp].food);setMood('eat',1400);blip(500);say('Nom nom nom! 😋')}
    if(kind==='play'){
      if(pet.energy<15){say(pet.name+' is too sleepy to play. Try a nap! 🌙');return}
      pet.happy=Math.min(100,pet.happy+25);pet.energy=Math.max(15,pet.energy-12);pet.hunger=Math.max(15,pet.hunger-6);addGrowth(2);fx('⚽');fx('⭐');setMood('joy',1800);chime(700,.06,1);say('Wheee! So fun! 🎉')}
    if(kind==='clean'){
      if((pet.poops||0)===0&&pet.clean>=90){say('Already squeaky clean! ✨');return}
      pet.poops=0;pet.clean=100;addGrowth(1);fx('🫧');fx('✨');setMood('happy',1500);say('Sparkly clean! ✨')}
    save();drawScene();drawBars();
  }
  function viewPlay(){
    applyTime();
    m.innerHTML='<h3 style="text-align:center;margin-bottom:8px">'+esc(pet.name)+' <small>the '+PETS[pet.sp].n+'</small></h3>'+
    '<div class="scene" id="scene"></div><div class="petsay" id="psay">Tap '+esc(pet.name)+' to pet it 💕</div>'+
    '<div class="bars" id="bars"></div><div class="stepper" id="gl"></div><div class="bar"><i id="grow"></i></div><div style="height:12px"></div>'+
    '<div class="abts"><button class="abtn" data-a="feed"><span>'+PETS[pet.sp].food+'</span>Feed</button><button class="abtn" data-a="play"><span>⚽</span>Play</button><button class="abtn" data-a="clean"><span>🧼</span>Clean</button><button class="abtn" data-a="sleep" id="sl"><span>🌙</span>Sleep</button></div>'+
    '<div class="row center" style="margin-top:18px"><button class="btn ghost" id="newegg">🥚 Hatch a new egg</button></div>'+petHall();
    m.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){ac();act(b.dataset.a)}});
    $('#newegg',m).onclick=function(){
      if(!confirmNew){confirmNew=true;this.textContent='Tap again: '+pet.name+' moves to the Pet Hall';return}
      var hall=store.get('hall',[]);hall.push({sp:pet.sp,name:pet.name,stage:pet.stage});store.set('hall',hall.slice(-12));
      pet=null;store.set('pet',null);show();
    };
    drawScene();drawBars();
    tick=setInterval(function(){
      if(!cur||cur.name!=='pet')return;
      applyTime();drawBars();save();
      if(moodNow()!==lastMood)drawScene();
    },1000);
  }
  show();
}};

S.memory={title:'Memory Match',render:function(m){
  var ALL=['🐰','🐱','🐻','🦊','🐼','🐸','🦄','🐙','🐧','🦋','🐢','🐨'],cards,open,matched,moves,lock,timers=[];
  onLeave(function(){timers.forEach(clearTimeout)});
  function sh(a){return a.sort(function(){return Math.random()-.5})}
  function reset(){var set=sh(ALL.slice()).slice(0,8);cards=sh(set.concat(set));open=[];matched=0;moves=0;lock=false;draw()}
  function draw(){
    m.innerHTML='<p style="text-align:center">Flip two cards. Find all the matching pairs. Moves: <b>'+moves+'</b></p><div class="mg">'+cards.map(function(c,i){
      var st=cards[i].d?' d':(open.indexOf(i)>-1?' o':'');return '<button class="mc'+st+'" data-i="'+i+'">'+((cards[i].d||open.indexOf(i)>-1)?cards[i].e:'💙')+'</button>'}).join('')+'</div>'+(matched===16?'<div class="msg">🎉 All matched in '+moves+' moves!</div>':'<div class="msg"></div>')+'<div class="row center"><button class="btn" id="rs">New game</button></div>';
    m.querySelectorAll('.mc').forEach(function(b){b.onclick=function(){flip(+b.dataset.i)}});$('#rs',m).onclick=reset;
  }
  function flip(i){
    if(lock||cards[i].d||open.indexOf(i)>-1)return;open.push(i);blip(450);
    if(open.length===2){moves++;var a=cards[open[0]],b=cards[open[1]];
      if(a.e===b.e){a.d=b.d=true;matched+=2;open=[];chime(660,.07,1);if(matched===16){confetti(60);chime(528)}}
      else{lock=true;draw();timers.push(setTimeout(function(){open=[];lock=false;draw()},800));return}}
    draw();
  }
  var base=ALL;ALL=base;
  var _reset=reset;reset=function(){var set=sh(base.slice()).slice(0,8);cards=sh(set.concat(set).map(function(e){return {e:e,d:false}}));open=[];matched=0;moves=0;lock=false;draw()};
  reset();
}};
S.fireflies={title:'Firefly Jar',render:function(m){
  var N=7,caught=0,ffs=[],raf=null,box;
  m.innerHTML='<p style="text-align:center">Gently tap the fireflies to catch them. There is no timer. Fireflies caught: <b id="fc">0</b>/10</p><div class="ffs" id="ffs"></div><div class="msg" id="fm"></div>';
  box=$('#ffs',m);
  function spawn(){
    var b=document.createElement('button');b.className='ff';b.setAttribute('aria-label','firefly');
    var f={el:b,x:Math.random(),y:Math.random()*.8,vx:(Math.random()-.5)*.0016,vy:(Math.random()-.5)*.0016,ph:Math.random()*6};
    b.onclick=function(e){e.stopPropagation();caught++;blip(500+caught*40);b.remove();ffs.splice(ffs.indexOf(f),1);
      $('#fc',m).textContent=Math.min(caught,10);
      if(caught>=10){$('#fm',m).textContent='🌟 The jar is full! Look how bright it is. Catch-and-release: they float back out...';chime(528);confetti(30);caught=0;setTimeout(function(){$('#fc',m)&&($('#fc',m).textContent=0);$('#fm',m)&&($('#fm',m).textContent='')},3500)}
      setTimeout(function(){if(cur&&cur.name==='fireflies')spawn()},900)};
    box.appendChild(b);ffs.push(f);
  }
  for(var i=0;i<N;i++)spawn();
  function loop(t){
    ffs.forEach(function(f){f.ph+=.02;f.x+=f.vx+Math.sin(f.ph)*.0008;f.y+=f.vy+Math.cos(f.ph*.8)*.0008;
      if(f.x<.04||f.x>.96)f.vx*=-1;if(f.y<.04||f.y>.9)f.vy*=-1;f.x=Math.max(.02,Math.min(.98,f.x));f.y=Math.max(.02,Math.min(.95,f.y));
      f.el.style.left=(f.x*100)+'%';f.el.style.top=(f.y*100)+'%';f.el.style.opacity=.65+.35*Math.sin(f.ph*3)});
    raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop);onLeave(function(){cancelAnimationFrame(raf)});
}};
S.echo={title:'Pattern Echo',render:function(m){
  var COLS=['#ff7a8a','#ffd24d','#63e6a0','#6aa8ff'],FR=[262,330,392,523],seq=[],idx=0,inp=false,best=0,timers=[];
  onLeave(function(){timers.forEach(clearTimeout)});
  m.innerHTML='<p style="text-align:center">Watch the pattern, then repeat it. If you slip, no worries, it just replays. Best streak: <b id="bs">0</b></p><div class="pads">'+COLS.map(function(c,i){return '<button class="pad" data-p="'+i+'" style="background:'+c+';color:'+c+'"></button>'}).join('')+'</div><div class="msg" id="em">Press Start</div><div class="row center"><button class="btn primary" id="st">Start</button></div>';
  function tone(f){if(!soundOn)return;try{var a=ac(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.4);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.45)}catch(e){}}
  function light(i){var p=$('[data-p="'+i+'"]',m);if(!p)return;p.classList.add('lit');tone(FR[i]);timers.push(setTimeout(function(){p.classList.remove('lit')},350))}
  function play(){inp=false;idx=0;$('#em',m).textContent='Watch...';
    seq.forEach(function(p,k){timers.push(setTimeout(function(){light(p)},600+k*700))});
    timers.push(setTimeout(function(){inp=true;$('#em',m).textContent='Your turn!'},600+seq.length*700))}
  function addStep(){seq.push(Math.floor(Math.random()*4))}
  $('#st',m).onclick=function(){ac();seq=[];addStep();play();this.textContent='Restart'};
  m.querySelectorAll('.pad').forEach(function(b){b.onclick=function(){
    if(!inp)return;var p=+b.dataset.p;light(p);
    if(p===seq[idx]){idx++;if(idx>=seq.length){inp=false;best=Math.max(best,seq.length);$('#bs',m).textContent=best;$('#em',m).textContent='✨ Nice!';addStep();timers.push(setTimeout(play,1000))}}
    else{inp=false;$('#em',m).textContent='Oops! No worries, watch again 💙';timers.push(setTimeout(play,1100))}
  }});
}};
